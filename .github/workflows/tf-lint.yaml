name: Terraform Lint (reusable)

# Reusable workflow: runs fmt / validate / tflint against the caller's checked-out code.
# Callers invoke this via `uses: ./.github/workflows/tf-lint.yaml` (same repo) or
# `uses: <owner>/<repo>/.github/workflows/tf-lint.yaml@<ref>` (cross-repo).

on:
  workflow_call:
    inputs:
      terraform_version:
        description: "Terraform version to install"
        type: string
        required: false
        default: "1.15.8"
      tflint_version:
        description: "TFLint version to install"
        type: string
        required: false
        default: "latest"
      working_directory:
        description: "Directory containing the Terraform code to lint"
        type: string
        required: false
        default: "."

permissions:
  contents: read

jobs:
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Cache TFLint plugin dir
        uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles(format('{0}/.tflint.hcl', inputs.working_directory)) }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: TFLint init
        env:
          # Avoid GitHub API rate limits when downloading plugins (e.g. tflint-ruleset-aws).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: TFLint
        run: tflint --format compact --recursive

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.working_directory }}
          framework: terraform
          quiet: true            # only print failed checks
          soft_fail: false       # non-zero exit on any failed check → check goes red
          output_format: cli
          # Load repo-local custom policies (YAML rules under .checkov/policies).
          external_checks_dirs: .checkov/policies
          # Comma-separated Checkov check IDs to ignore. Example:
          #   skip_check: CKV_AWS_23,CKV2_AWS_5
          # Prefer this over disabling whole categories.
          skip_check: ""
