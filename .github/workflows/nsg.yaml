name: Terraform - test-nsg

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy
      auto_approve:
        description: "Skip interactive approval (apply/destroy)"
        type: boolean
        required: false
        default: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

concurrency:
  group: terraform-test-nsg
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ (inputs.action != 'plan' && !inputs.auto_approve) && 'production' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-test-nsg

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform plan (destroy)
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -no-color -out=tfplan

      - name: Show plan summary
        run: terraform show -no-color tfplan | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            tfplan
            plan.txt
          retention-days: 5

      - name: Terraform apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: terraform output -no-color
